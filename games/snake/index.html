<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="game-page">
    <a href="../../index.html" class="back-btn">← Назад</a>
    <h1>🐍 Змейка</h1>
    <div class="score">Очки: <span id="score">0</span></div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <p class="controls-hint">← → ↑ ↓ — управление &nbsp;|&nbsp; R — перезапуск</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20, SZ = 400 / GRID;

    let snake, dir, nextDir, food, score, alive, started;

    function init() {
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir = {x:1, y:0};
      nextDir = {x:1, y:0};
      score = 0;
      alive = true;
      started = false;
      document.getElementById('score').textContent = 0;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function step() {
      if (!alive || !started) return;
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        alive = false;
        draw();
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, 400, 400);

      // Grid
      ctx.strokeStyle = '#151528';
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i*SZ, 0); ctx.lineTo(i*SZ, 400); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i*SZ); ctx.lineTo(400, i*SZ); ctx.stroke();
      }

      // Food (pulsing apple)
      ctx.shadowColor = '#dc2626';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(food.x*SZ + SZ/2, food.y*SZ + SZ/2, SZ/2 - 2, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake body
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        const lightness = 25 + ratio * 30;
        ctx.fillStyle = `hsl(130, 65%, ${lightness}%)`;
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(seg.x*SZ + pad, seg.y*SZ + pad, SZ - pad*2, SZ - pad*2, 4);
        ctx.fill();
      });

      // Head eyes
      const h = snake[0];
      ctx.fillStyle = '#fff';
      const eyes = getEyePositions(h);
      eyes.forEach(([ex, ey]) => {
        ctx.beginPath();
        ctx.arc(h.x*SZ + ex, h.y*SZ + ey, 2.5, 0, Math.PI*2);
        ctx.fill();
      });

      // Overlays
      if (!started && alive) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 160, 400, 80);
        ctx.fillStyle = '#a78bfa';
        ctx.font = 'bold 22px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Нажми стрелку для старта', 200, 207);
      }

      if (!alive) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, canvas.height/2 - 65, 400, 120);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ИГРА ОКОНЧЕНА', 200, canvas.height/2 - 15);
        ctx.font = '18px Arial';
        ctx.fillStyle = '#a78bfa';
        ctx.fillText('Нажми R для перезапуска', 200, canvas.height/2 + 25);
      }
    }

    function getEyePositions(h) {
      if (dir.x === 1)  return [[SZ-5, 5], [SZ-5, SZ-5]];
      if (dir.x === -1) return [[5, 5],    [5, SZ-5]];
      if (dir.y === -1) return [[5, 5],    [SZ-5, 5]];
      return                   [[5, SZ-5], [SZ-5, SZ-5]];
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'r' || e.key === 'R') { init(); return; }
      if (!alive) return;
      const map = {
        ArrowLeft:  {x:-1, y:0},
        ArrowRight: {x:1,  y:0},
        ArrowUp:    {x:0,  y:-1},
        ArrowDown:  {x:0,  y:1}
      };
      if (map[e.key]) {
        const nd = map[e.key];
        if (nd.x !== -dir.x || nd.y !== -dir.y) {
          nextDir = nd;
          started = true;
        }
        e.preventDefault();
      }
    });

    init();
    setInterval(step, 140);
  </script>
</body>
</html>
