<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тетрис</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="game-page">
    <a href="../../index.html" class="back-btn">← Назад</a>
    <h1>🟦 Тетрис</h1>
    <div class="score">Очки: <span id="score">0</span> &nbsp;|&nbsp; Уровень: <span id="level">1</span></div>
    <canvas id="canvas" width="300" height="600"></canvas>
    <p class="controls-hint">← → — двигать &nbsp;|&nbsp; ↑ — повернуть &nbsp;|&nbsp; ↓ — ускорить &nbsp;|&nbsp; R — перезапуск</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const COLS = 10, ROWS = 20, SZ = 30;

    const COLORS = [
      '', '#2563eb', '#f59e0b', '#7c3aed', '#16a34a',
      '#dc2626', '#0891b2', '#db2777'
    ];

    // Each shape is an array of [row, col] offsets from pivot
    const SHAPES = [
      null,
      [[0,0],[0,1],[0,2],[0,3]],   // I
      [[0,0],[0,1],[1,0],[1,1]],   // O
      [[0,1],[1,0],[1,1],[1,2]],   // T
      [[0,0],[1,0],[2,0],[2,1]],   // L
      [[0,1],[1,1],[2,1],[2,0]],   // J
      [[0,1],[0,2],[1,0],[1,1]],   // S
      [[0,0],[0,1],[1,1],[1,2]],   // Z
    ];

    let board, score, level, piece, gameOver, dropTimer, dropSpeed;

    function init() {
      board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
      score = 0; level = 1; gameOver = false;
      dropTimer = 0; dropSpeed = 600;
      document.getElementById('score').textContent = 0;
      document.getElementById('level').textContent = 1;
      spawn();
    }

    function spawn() {
      const type = Math.ceil(Math.random() * 7);
      const cells = SHAPES[type].map(([r,c]) => [r, c]);
      piece = { type, cells, color: COLORS[type] };
      // center horizontally
      const minC = Math.min(...cells.map(([,c]) => c));
      const maxC = Math.max(...cells.map(([,c]) => c));
      const offset = Math.floor((COLS - (maxC - minC + 1)) / 2) - minC;
      piece.cells = cells.map(([r,c]) => [r, c + offset]);
      if (collides(piece.cells)) gameOver = true;
    }

    function collides(cells) {
      return cells.some(([r,c]) =>
        r >= ROWS || c < 0 || c >= COLS || (r >= 0 && board[r][c])
      );
    }

    function rotatePiece() {
      // Rotate 90° clockwise around center of bounding box
      const minR = Math.min(...piece.cells.map(([r]) => r));
      const maxR = Math.max(...piece.cells.map(([r]) => r));
      const minC = Math.min(...piece.cells.map(([,c]) => c));
      const maxC = Math.max(...piece.cells.map(([,c]) => c));
      const cr = (minR + maxR) / 2, cc = (minC + maxC) / 2;
      const rotated = piece.cells.map(([r,c]) => [
        Math.round(cr + (c - cc)),
        Math.round(cc - (r - cr))
      ]);
      if (!collides(rotated)) piece.cells = rotated;
    }

    function movePiece(dr, dc) {
      const moved = piece.cells.map(([r,c]) => [r+dr, c+dc]);
      if (!collides(moved)) { piece.cells = moved; return true; }
      return false;
    }

    function lock() {
      piece.cells.forEach(([r,c]) => {
        if (r >= 0) board[r][c] = piece.type;
      });
      clearLines();
      spawn();
    }

    function clearLines() {
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(v => v)) {
          board.splice(r, 1);
          board.unshift(Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }
      if (cleared) {
        score += [0, 100, 300, 600, 1000][cleared];
        level = Math.floor(score / 500) + 1;
        dropSpeed = Math.max(80, 600 - (level - 1) * 60);
        document.getElementById('score').textContent = score;
        document.getElementById('level').textContent = level;
      }
    }

    function draw() {
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#151528';
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath(); ctx.moveTo(0, r*SZ); ctx.lineTo(COLS*SZ, r*SZ); ctx.stroke();
      }
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath(); ctx.moveTo(c*SZ, 0); ctx.lineTo(c*SZ, ROWS*SZ); ctx.stroke();
      }

      // Board
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (board[r][c]) drawCell(r, c, COLORS[board[r][c]]);

      // Active piece
      if (!gameOver)
        piece.cells.forEach(([r,c]) => { if (r >= 0) drawCell(r, c, piece.color); });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, canvas.height/2 - 70, canvas.width, 130);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width/2, canvas.height/2 - 15);
        ctx.font = '18px Arial';
        ctx.fillStyle = '#a78bfa';
        ctx.fillText('Нажми R для перезапуска', canvas.width/2, canvas.height/2 + 25);
      }
    }

    function drawCell(r, c, color) {
      ctx.fillStyle = color;
      ctx.fillRect(c*SZ+1, r*SZ+1, SZ-2, SZ-2);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(c*SZ+2, r*SZ+2, SZ-4, 5);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(c*SZ+1, r*SZ+SZ-6, SZ-2, 5);
    }

    let lastTime = 0;
    function loop(time = 0) {
      if (!gameOver) {
        dropTimer += time - lastTime;
        if (dropTimer >= dropSpeed) {
          if (!movePiece(1, 0)) lock();
          dropTimer = 0;
        }
        lastTime = time;
        draw();
        requestAnimationFrame(loop);
      } else {
        draw();
      }
    }

    document.addEventListener('keydown', e => {
      if (gameOver) {
        if (e.key === 'r' || e.key === 'R') { init(); lastTime = 0; requestAnimationFrame(loop); }
        return;
      }
      switch (e.key) {
        case 'ArrowLeft':  movePiece(0, -1); break;
        case 'ArrowRight': movePiece(0,  1); break;
        case 'ArrowDown':  if (!movePiece(1, 0)) lock(); dropTimer = 0; break;
        case 'ArrowUp':    rotatePiece(); break;
        case ' ':
          while (movePiece(1, 0)) {}
          lock(); dropTimer = 0;
          break;
        case 'r': case 'R': init(); lastTime = 0; requestAnimationFrame(loop); return;
      }
      if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))
        e.preventDefault();
    });

    init();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
